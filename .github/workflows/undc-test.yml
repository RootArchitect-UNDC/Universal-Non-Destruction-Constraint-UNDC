name: UNDC Reference Implementation Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-undc:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y clang llvm libbpf-dev bpftool linux-tools-generic nodejs npm curl

      - name: Install Circom and SnarkJS
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          git clone https://github.com/iden3/circom.git
          cd circom
          cargo build --release
          cargo install --path circom
          sudo npm install -g snarkjs

      - name: Compile eBPF Module
        run: |
          cd technical/code
          clang -g -O2 -target bpf -c undc_compliance.bpf.c -o undc_compliance.o

      - name: Compile ZK Circuit
        run: |
          cd technical/code
          circom verifier.circom --r1cs --wasm --sym

      - name: Run ZK Test Pipeline
        run: |
          cd technical/code
          chmod +x test_pipeline.sh
          ./test_pipeline.sh

      - name: Verify Proof
        run: |
          cd technical/code/build
          snarkjs groth16 verify verification_key.json public.json proof.json
