name: UNDC Schema Compliance Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true

      - name: Verify Node.js version
        run: node --version

      - name: Install check-jsonschema
        run: npm install -g check-jsonschema

      - name: Validate UNDC log sample
        run: check-jsonschema --schemafile undc-schema.json undc-log-sample.json
