name: UNDC Schema Compliance Validation

on: [push, pull_request]

jobs:
  validate-schema:
    name: Execute Schema Validation Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install check-jsonschema
        run: pip install check-jsonschema

      - name: Assert Configuration Integrity
        run: |
          echo "Running structure validation matrix..."
          check-jsonschema --schemafile undc-schema.json UNDC.json
          echo "✅ SUCCESS: Data payload cleanly matches structural schema rules."
