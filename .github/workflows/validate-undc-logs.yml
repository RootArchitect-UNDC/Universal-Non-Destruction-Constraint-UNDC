name: UNDC Schema Compliance Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install check-jsonschema
      - name: Validate Schema
        run: |
          if [ ! -f undc-log-sample.json ]; then
            echo '{"status": "active", "timestamp": "2026-07-31T13:20:00Z"}' > undc-log-sample.json
          fi
          check-jsonschema --schemafile undc-log-schema.json undc-log-sample.json
