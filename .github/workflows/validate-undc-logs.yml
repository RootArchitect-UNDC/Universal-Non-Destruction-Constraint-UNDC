name: UNDC Schema Compliance Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-schema:
    name: Execute Schema Validation Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Validator Locally
        run: npm install ajv-cli ajv-formats

      - name: Validate Schema
        run: |
          npx ajv validate -s undc-log-schema.json -d undc-log-sample.json -c ajv-formats --spec=draft2020
