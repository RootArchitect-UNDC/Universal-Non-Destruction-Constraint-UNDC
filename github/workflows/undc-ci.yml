name: UNDC CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-schemas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install jsonschema pyyaml
          pip install -r requirements.txt || true

      - name: Validate Semantic Provenance Schema
        run: |
          python -c "import json, jsonschema; jsonschema.validate(instance=json.load(open('semantic-provenance-schema.json')), schema=json.load(open('semantic-provenance-schema.json')))"

      - name: Run Semantic Test Harness
        run: python undc_semantic_test_harness.py

      - name: Run HITL Multi-Sig Verifier
        run: python undc_hitl_verifier.py

      - name: Validate YAML formatting
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('undc-agent-pod.yaml'))"
